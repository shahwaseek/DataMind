<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataMind — Local-First AI Data Analyst</title>
    <meta name="description" content="Local-first AI analytics application that converts natural-language questions into reproducible, evidence-backed data analysis." />
    
    <!-- Google Fonts & Material Symbols (Matching Stitch Specification) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CDN with Container Queries & Forms (Exact Stitch Setup) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'bg-deep': '#080A0C',
              'background': '#0c141e',
              'surface-main': '#0B0D10',
              'surface-raised': '#111418',
              'surface-container-lowest': '#070f19',
              'surface-container-low': '#141c27',
              'surface-container': '#18202b',
              'surface-container-high': '#232a36',
              'surface-container-highest': '#2d3541',
              'surface-variant': '#2d3541',
              'primary': '#c6bfff',
              'on-primary': '#2800a0',
              'primary-container': '#8c80ff',
              'on-primary-container': '#22008d',
              'inverse-primary': '#5845d9',
              'text-primary': '#F5F7FA',
              'text-muted': '#6F7784',
              'on-surface': '#e5e0ed',
              'on-surface-variant': '#c8c4d7',
              'outline-variant': '#474554',
              'border-strong': '#343B46',
              'border-micro': '#1A1D21',
              'success': '#32C48D',
              'danger': '#F26D78',
              'tertiary': '#ffb875',
            },
            fontFamily: {
              'display': ['Outfit', 'Inter', 'sans-serif'],
              'body': ['Inter', 'sans-serif'],
              'code': ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#080A0C] text-[#F5F7FA] antialiased selection:bg-[#8c80ff] selection:text-[#22008d]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
